# /etc/nginx/conf.d/verity.conf - the only public listener (deploy/ec2.md).
# Replace verity.example.com (3 places) with your domain.
#
# :80 exists only to redirect to HTTPS (certbot's renewal uses --standalone
# with nginx briefly stopped, so no ACME location is needed here).
# :443 terminates TLS and proxies everything to the Next.js frontend on
# loopback; the frontend's /api proxy is the only path to FastAPI.

limit_req_zone  $binary_remote_addr zone=verity_auth:10m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=verity_api:10m  rate=20r/s;
limit_conn_zone $binary_remote_addr zone=verity_conn:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 301 https://verity.example.com$request_uri;
}

server {
    # "listen ... http2" rather than "http2 on;": Ubuntu 24.04 ships nginx 1.24.
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name verity.example.com;

    ssl_certificate     /etc/letsencrypt/live/verity.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/verity.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:verity_ssl:10m;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Matches the backend's MAX_UPLOAD_BYTES (20 MB) plus multipart overhead.
    client_max_body_size 21m;
    client_body_timeout 30s;
    limit_conn verity_conn 30;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_http_version 1.1;
    # Supabase session cookies are large (several chunked Set-Cookie headers):
    # nginx's 4-8k defaults turn /auth/callback into a 502 "upstream sent too
    # big header", and the browser's Cookie header needs room on every request.
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;
    large_client_header_buffers 4 16k;
    proxy_set_header Host $host;
    # Overwrite, never append: nothing a client sends in these is trusted.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    # Identity travels only as the session cookie -> Bearer JWT; strip any
    # identity-looking headers a client tries to inject.
    proxy_set_header X-User-Id "";
    proxy_set_header X-Forwarded-User "";

    # Login/OAuth endpoints: slow brute-force and OAuth-start floods.
    location /auth/ {
        limit_req zone=verity_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # Live run stream (SSE): no buffering, long-lived.
    location ~ ^/api/invoices/[^/]+/stream$ {
        limit_req zone=verity_api burst=40 nodelay;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_pass http://127.0.0.1:3000;
    }

    location /api/ {
        limit_req zone=verity_api burst=40 nodelay;
        # POST /invoices blocks for the whole extraction (docs/api.md).
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
