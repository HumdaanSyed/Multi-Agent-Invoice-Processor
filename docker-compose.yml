# Local full-stack testing (Phase 10) - both services from the same image
# (Dockerfile), differing only in the command each runs. Production
# deployment (Railway/EC2) is documented separately in deploy/ - this file
# is for `docker compose up` on your own machine.
#
# `image:` is set to the same tag on both services, with `build:` only on
# `backend` - Compose then builds once under that tag and `frontend` just
# runs it, rather than each service getting its own independent `build: .`
# (which used to silently produce two separate ~945MB images).
#
# Named volumes, not bind mounts, for checkpoints/uploads/exports: the
# runtime image runs as a non-root user (Dockerfile), and a bind mount
# preserves the HOST directory's ownership inside the container - on a
# native Linux Docker host that's a near-guaranteed "permission denied"
# the first time the container tries to write its own SQLite file. A named
# volume sidesteps this entirely (Docker owns it, no host-side UID to
# conflict with) at the cost of not being able to `ls checkpoints/` on the
# host directly - use `docker compose exec backend ls checkpoints/` (or
# `docker cp`) to inspect instead.

services:
  backend:
    build: .
    image: invoice-agent:local
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - checkpoint_data:/app/checkpoints
      - upload_data:/app/uploads
      - export_data:/app/exports
    restart: unless-stopped
    # No explicit healthcheck: block - relies on the Dockerfile's own
    # HEALTHCHECK instruction, which frontend's depends_on below reads.

  frontend:
    image: invoice-agent:local
    command: ["sh", "frontend/start.sh"]
    healthcheck:
      # The Dockerfile's own HEALTHCHECK is baked into the image and
      # probes the backend's port 8000 - `command:` above doesn't replace
      # it, so without this override frontend would inherit a healthcheck
      # that can never succeed (nothing listens on 8000 in this
      # container) and would report unhealthy forever despite serving
      # traffic correctly on 8501. /_stcore/health is Streamlit's own
      # built-in health endpoint.
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # Overrides .env's local-dev default (http://127.0.0.1:8000) -
      # compose's internal DNS resolves service names, so the frontend
      # container reaches the backend container by name, not loopback.
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  checkpoint_data:
  upload_data:
  export_data:
