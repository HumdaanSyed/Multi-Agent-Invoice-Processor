# Local full-stack testing - the FastAPI backend (Dockerfile) and the Next.js
# frontend, Verity (web/Dockerfile), each built from its own image. Production
# deployment (Railway/EC2) is documented separately in deploy/ - this file
# is for `docker compose up` on your own machine.
#
# Named volumes, not bind mounts, for checkpoints/uploads: the
# runtime image runs as a non-root user (Dockerfile), and a bind mount
# preserves the HOST directory's ownership inside the container - on a
# native Linux Docker host that's a near-guaranteed "permission denied"
# the first time the container tries to write its own SQLite file. A named
# volume sidesteps this entirely (Docker owns it, no host-side UID to
# conflict with) at the cost of not being able to `ls checkpoints/` on the
# host directly - use `docker compose exec backend ls checkpoints/` (or
# `docker cp`) to inspect instead.

services:
  backend:
    build: .
    image: invoice-agent:local
    # No ports: the backend is reachable only on the compose network, by the
    # frontend's /api proxy. Nothing outside Docker can call it directly.
    env_file:
      - .env
    volumes:
      - checkpoint_data:/app/checkpoints
      - upload_data:/app/uploads
      # The "Local folder" MCP source (filesystem_invoices.py) reads PDFs
      # dropped here on your machine - the Inbox page's no-Gmail fallback.
      - ./data/inbox:/app/data/inbox
    restart: unless-stopped
    # No explicit healthcheck: block - relies on the Dockerfile's own
    # HEALTHCHECK instruction, which frontend's depends_on below reads.

  frontend:
    build: ./web
    image: verity-web:local
    # Loopback only: on a server, nginx in front terminates TLS (deploy/aws.md).
    ports:
      - "127.0.0.1:3000:3000"
    # No env_file: only these non-secret values are interpolated from .env,
    # so the frontend never receives ANTHROPIC_API_KEY, SUPABASE_KEY or GMAIL_*
    # - a container that doesn't hold them can't leak them.
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      OWNER_USER_ID: ${OWNER_USER_ID:-}
      ALLOWED_USER_IDS: ${ALLOWED_USER_IDS:-}
      # OAuth redirect origin; without it a standalone container may build the
      # callback from its own bind address, which Supabase won't accept.
      SITE_URL: http://localhost:3000
      # Inside the compose network, service names resolve.
      API_INTERNAL_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    # Healthcheck comes from web/Dockerfile's own HEALTHCHECK.

volumes:
  checkpoint_data:
  upload_data:
