name: Build and publish Docker image

# Runs the offline test suite first (matches CLAUDE.md's "run the relevant
# smoke test... before considering the task done" applied to CI itself),
# then builds and pushes both images to GHCR - the backend
# (Dockerfile -> invoice-agent) and the Next.js frontend (web/Dockerfile ->
# verity-web). This is what deploy/ec2.md's "pull pre-built images, never
# build on the box" step pulls from; the frontend image reads its backend
# URLs at runtime, so one build serves every deployment. No secrets to configure: GHCR authenticates with
# the repo's own built-in GITHUB_TOKEN.
#
# One job, not two: a separate "test" job gated on by a "build" job's
# `needs:` gains no parallelism (the build always waits on the tests
# anyway) and just forces a second checkout on a second runner. A single
# job with the test steps first gets identical fail-fast behavior - a
# failing pytest step aborts the remaining steps - for one checkout.

on:
  push:
    branches: [main]
  # Pull requests run the tests and *build* both images (nothing is pushed
  # or logged in) so a broken Dockerfile or a failed font download shows up
  # on the PR instead of after the merge.
  pull_request:
  workflow_dispatch: {}

env:
  IMAGE_NAME: invoice-agent
  WEB_IMAGE_NAME: verity-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.2"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run test suite
        # All tests are offline (mocked at the connection seam) - no
        # ANTHROPIC_API_KEY/SUPABASE_* needed, see tests/*.py's docstrings.
        run: uv run pytest tests/ -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image path (GHCR requires lowercase)
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${WEB_IMAGE_NAME}" >> "$GITHUB_ENV"

      # Build BOTH images before pushing either: if the frontend build
      # fails, :latest for the backend must not have already moved (that left
      # the two images out of sync on the next redeploy). The push steps
      # below re-run the same builds, served from the layer cache.
      - name: Build backend
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Push backend
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend

      - name: Push frontend
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend

  # Deploys the commit just pushed to the EC2 box (deploy/ec2.md, "Automatic
  # deploys"). Keyless: GitHub's OIDC token is exchanged for short-lived AWS
  # credentials on a role that trusts only this repo's `production`
  # environment and may only send the verity-deploy SSM document (which runs
  # deploy/aws/deploy.sh with a validated SHA - no arbitrary shell) to one
  # instance. The `production` environment requires a manual approval and is
  # limited to the main branch, so a merge waits for a click before going live.
  deploy:
    needs: build-and-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      id-token: write  # request the OIDC token
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      INSTANCE_ID: ${{ vars.VERITY_INSTANCE_ID }}
    steps:
      - name: Get short-lived AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: verity-deploy-${{ github.run_id }}

      - name: Deploy through SSM and wait for the result
        run: |
          set -euo pipefail
          cmd=$(aws ssm send-command \
            --document-name verity-deploy \
            --instance-ids "$INSTANCE_ID" \
            --parameters "sha=$GITHUB_SHA" \
            --comment "deploy $GITHUB_SHA" \
            --query Command.CommandId --output text)
          echo "SSM command $cmd"

          # deploy.sh pulls, restarts and waits up to 180s for healthchecks;
          # the document's own timeout is 600s.
          status=Pending
          for _ in $(seq 1 120); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          aws ssm get-command-invocation --command-id "$cmd" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text || true
          echo "Result: $status"
          [ "$status" = Success ]
