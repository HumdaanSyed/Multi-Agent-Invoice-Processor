name: Build and publish Docker image

# Runs the offline test suite first (matches CLAUDE.md's "run the relevant
# smoke test... before considering the task done" applied to CI itself),
# then builds the single shared image (Dockerfile) and pushes it to GHCR -
# this is what deploy/ec2.md's "pull a pre-built image, never build on the
# box" step pulls from. No secrets to configure: GHCR authenticates with
# the repo's own built-in GITHUB_TOKEN.
#
# One job, not two: a separate "test" job gated on by a "build" job's
# `needs:` gains no parallelism (the build always waits on the tests
# anyway) and just forces a second checkout on a second runner. A single
# job with the test steps first gets identical fail-fast behavior - a
# failing pytest step aborts the remaining steps - for one checkout.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE_NAME: invoice-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.12.2"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run test suite
        # All 226 tests are offline (mocked at the connection seam) - no
        # ANTHROPIC_API_KEY/SUPABASE_* needed, see tests/*.py's docstrings.
        run: uv run pytest tests/ -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image path (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
